<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Skirmishers of SPLORR!!</title>
	<style>
		html, body { margin: 0; height: 100%; background: #111; }
		body { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font: 12px/1.4 monospace; }
		canvas { width: min(100vw, calc((100vh - 44px) * 1060 / 580)); aspect-ratio: 1060 / 580; display: block; touch-action: none; }
		footer { margin-top: 6px; min-height: 38px; text-align: center; max-width: 95vw; }
		@media (max-width: 700px) { footer { font-size: 10px; } }
		footer a { color: #aaa; }
		#log { position: fixed; left: 0; bottom: 0; margin: 0; color: #aaa; font: 12px monospace; }
	</style>
</head>
<body>
	<canvas id="canvas" width="1060" height="580"></canvas>
	<footer>
		Skirmishers of SPLORR!! by TheGrumpyGameDev. Made by an AI agent (Claude Code) at the author's direction.
		<a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
	</footer>
	<pre id="log"></pre>
	<script src="odin.js"></script>
	<script>
		const cv = document.getElementById("canvas");
		const g = cv.getContext("2d");
		const rgb = (r, gr, b, a = 1) => `rgba(${r * 255 | 0},${gr * 255 | 0},${b * 255 | 0},${a})`;
		const memory = new odin.WasmMemoryInterface();
		g.imageSmoothingEnabled = false;
		// Sprites: art.png is a strip of 16x16 sprites in Anvil sprite-set order
		// (tools/gen_atlas.py); `Sprite` in src/main.odin follows the same order.
		const SPRITE = 16;
		const atlas = new Image();
		atlas.src = "art.png";

		// Sounds: WAVs made in the Anvil (sound_export). The order must match
		// `Sound` in src/main.odin. Browsers only allow audio after the player
		// presses something, so they are fetched and decoded on the first press.
		const SOUND_FILES = ["step", "stab", "sling", "hit", "block", "slain", "fortify", "your_turn", "win", "lose", "bow", "crossbow", "chant"];
		let audio = null, gain = null;
		// mute (M or the Sound button) is remembered in this browser
		let muted = false;
		try { muted = localStorage.getItem("skirmishers.muted") === "1"; } catch (e) {}
		const buffers = [];
		const unlockAudio = () => {
			if (audio) return;
			audio = new (window.AudioContext || window.webkitAudioContext)();
			gain = audio.createGain();
			gain.gain.value = 0.3;
			gain.connect(audio.destination);
			SOUND_FILES.forEach((name, i) => {
				fetch(`sfx/${name}.wav`).then(r => r.arrayBuffer()).then(b => audio.decodeAudioData(b)).then(buf => { buffers[i] = buf; }).catch(() => {});
			});
		};
		addEventListener("keydown", unlockAudio);
		addEventListener("pointerdown", unlockAudio);
		const playSound = (id) => {
			if (muted || !audio || !buffers[id]) return;
			const src = audio.createBufferSource();
			src.buffer = buffers[id];
			src.connect(gain);
			src.start();
		};
		const hexPath = (cx, cy, rad) => {
			g.beginPath();
			for (let i = 0; i < 6; i++) {
				const a = Math.PI / 180 * (60 * i - 30); // pointy top
				const x = cx + rad * Math.cos(a), y = cy + rad * Math.sin(a);
				if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
			}
			g.closePath();
		};
		// Imports for `foreign import canvas "canvas"` in src/main.odin; all in canvas pixels.
		const imports = {
			canvas: {
				clear_canvas: (r, gr, b) => {
					g.fillStyle = rgb(r, gr, b);
					g.fillRect(0, 0, cv.width, cv.height);
				},
				fill_rect: (x, y, w, h, r, gr, b, a) => {
					g.fillStyle = rgb(r, gr, b, a);
					g.fillRect(x, y, w, h);
				},
				draw_hex: (cx, cy, rad, fr, fg, fb, fa, sr, sg, sb, sa, line) => {
					hexPath(cx, cy, rad);
					if (fa > 0) { g.fillStyle = rgb(fr, fg, fb, fa); g.fill(); }
					if (sa > 0 && line > 0) { g.strokeStyle = rgb(sr, sg, sb, sa); g.lineWidth = line; g.stroke(); }
				},
				draw_circle: (cx, cy, rad, fr, fg, fb, sr, sg, sb, line) => {
					g.beginPath();
					g.arc(cx, cy, rad, 0, Math.PI * 2);
					g.fillStyle = rgb(fr, fg, fb); g.fill();
					if (line > 0) { g.strokeStyle = rgb(sr, sg, sb); g.lineWidth = line; g.stroke(); }
				},
				set_alpha: (a) => { g.globalAlpha = a; },
				draw_line: (x0, y0, x1, y1, r, gr, b, width) => {
					g.beginPath();
					g.moveTo(x0, y0);
					g.lineTo(x1, y1);
					g.strokeStyle = rgb(r, gr, b);
					g.lineWidth = width;
					g.stroke();
				},
				blit: (sprite, cx, cy, scale) => {
					if (!atlas.complete || !atlas.naturalWidth) return;
					const s = SPRITE * scale;
					g.drawImage(atlas, sprite * SPRITE, 0, SPRITE, SPRITE, Math.round(cx - s / 2), Math.round(cy - s / 2), s, s);
				},
				play_sound: (id) => playSound(id),
				toggle_mute: () => {
					muted = !muted;
					try { localStorage.setItem("skirmishers.muted", muted ? "1" : "0"); } catch (e) {}
				},
				is_muted: () => muted,
				load_option: (id) => {
					try { const v = localStorage.getItem("skirmishers.option." + id); return v === null ? -1 : parseInt(v, 10); } catch (e) { return -1; }
				},
				save_option: (id, value) => {
					try { localStorage.setItem("skirmishers.option." + id, String(value)); } catch (e) {}
				},
				set_transform: (s, dx, dy) => { g.setTransform(s, 0, 0, s, dx, dy); },
				draw_text: (ptr, len, x, y, size, r, gr, b, align) => {
					g.font = `${size}px monospace`;
					g.textAlign = ["left", "center", "right"][align] || "left";
					g.textBaseline = "middle";
					g.fillStyle = rgb(r, gr, b);
					g.fillText(memory.loadString(ptr, len), x, y);
				},
			},
		};
		odin.runWasm("game.wasm", document.getElementById("log"), imports, memory);

		// Mouse: canvas pixels, whatever size the canvas is shown at.
		const toCanvas = (e) => {
			const r = cv.getBoundingClientRect();
			return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
		};
		cv.addEventListener("pointermove", (e) => {
			// a finger dragging is not hovering: only the mouse moves the cursor
			if (memory.exports && e.pointerType === "mouse") memory.exports.mouse_move(...toCanvas(e));
		});
		cv.addEventListener("pointerleave", () => {
			if (memory.exports) memory.exports.mouse_move(-1, -1);
		});
		cv.addEventListener("pointerdown", (e) => {
			if (!memory.exports) return;
			const [x, y] = toCanvas(e);
			if (e.pointerType === "touch" || e.pointerType === "pen") {
				// no hover on a touch screen: a tap looks first (touch_tap)
				memory.exports.touch_tap(x, y);
				return;
			}
			memory.exports.mouse_move(x, y);
			memory.exports.mouse_click(x, y);
		});

		// Layout: landscape (1060x580, the panel right of the map) or portrait
		// (672 wide, the panel below the map, larger), whichever shows the map
		// larger (on a tie, portrait) in this window; checked every frame, redone when the window's
		// size changes (a phone turned round). The footer keeps its own height.
		const footer = document.querySelector("footer");
		let fitted = "";
		const fit = () => {
			if (!memory.exports || !memory.exports.set_portrait) return;
			const W = innerWidth, H = Math.max(100, innerHeight - footer.offsetHeight - 6);
			if (fitted === W + "x" + H) return;
			fitted = W + "x" + H;
			const land = [1060, 580], port = [672, memory.exports.portrait_canvas_height()];
			const scale = ([w, h]) => Math.min(W / w, H / h);
			// portrait unless it would show the map noticeably smaller (its panel text is larger)
			const portrait = scale(port) >= scale(land) * 0.95;
			const [w, h] = portrait ? port : land;
			if (cv.width !== w || cv.height !== h) {
				cv.width = w; cv.height = h; // resets the context
				g.imageSmoothingEnabled = false;
			}
			const s = scale([w, h]);
			cv.style.width = Math.floor(w * s) + "px";
			cv.style.height = Math.floor(h * s) + "px";
			cv.style.aspectRatio = "auto";
			memory.exports.set_portrait(portrait);
		};

		// Gamepad: polled every frame and turned into the same seven buttons as
		// the keyboard (`Input` in src/ui.odin: 0 up, 1 down, 2 left, 3 right,
		// 4 OK, 5 cancel, 6 menu). Standard mapping: D-pad 12-15 or the left
		// stick, A (0) OK, B (1) cancel, Start (9) or Select (8) menu. A held
		// direction repeats.
		const PAD = { up: 0, down: 1, left: 2, right: 3, ok: 4, cancel: 5, menu: 6 };
		const padHeld = {};
		const REPEAT_DELAY = 0.35, REPEAT_EVERY = 0.12;
		let padLast = performance.now();
		const pollPads = (now) => {
			fit();
			const dt = (now - padLast) / 1000;
			padLast = now;
			const down = {};
			for (const pad of (navigator.getGamepads ? navigator.getGamepads() : [])) {
				if (!pad) continue;
				const b = (i) => pad.buttons[i] && pad.buttons[i].pressed;
				const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
				if (b(12) || ay < -0.5) down.up = true;
				if (b(13) || ay > 0.5) down.down = true;
				if (b(14) || ax < -0.5) down.left = true;
				if (b(15) || ax > 0.5) down.right = true;
				if (b(0)) down.ok = true;
				if (b(1)) down.cancel = true;
				if (b(9) || b(8)) down.menu = true;
			}
			for (const name in PAD) {
				if (down[name]) {
					const repeats = PAD[name] <= PAD.right;
					if (!(name in padHeld)) {
						padHeld[name] = REPEAT_DELAY;
						unlockAudio();
						if (memory.exports && memory.exports.press) memory.exports.press(PAD[name]);
					} else if (repeats) {
						padHeld[name] -= dt;
						if (padHeld[name] <= 0) {
							padHeld[name] = REPEAT_EVERY;
							if (memory.exports && memory.exports.press) memory.exports.press(PAD[name]);
						}
					}
				} else {
					delete padHeld[name];
				}
			}
			requestAnimationFrame(pollPads);
		};
		requestAnimationFrame(pollPads);

		// ?scenario=2 watches the computer play both sides.
		// QA: ?watch=1 hands every side to the computer; ?steps=N then plays N
		// computer actions at once (for screenshots).
		const params = new URLSearchParams(location.search);
		const wanted = parseInt(params.get("scenario"), 10);
		const steps = parseInt(params.get("steps"), 10);
		if (wanted > 0 || steps > 0) {
			const timer = setInterval(() => {
				if (memory.exports && memory.exports.load_scenario) {
					clearInterval(timer);
					if (wanted > 0) memory.exports.load_scenario(wanted);
					if (params.get("watch") === "1") memory.exports.debug_watch();
					if (steps > 0) memory.exports.debug_ai_steps(steps);
				}
			}, 50);
		}
	</script>
</body>
</html>
